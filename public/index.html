<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail-E | Campus Placement Notification System</title>
  <meta name="description"
    content="Automated campus recruitment notification platform that monitors emails, extracts placement intelligence via Gemini AI, and dispatches real-time alerts via Telegram Bot API and Android SMS Gateway.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Minimalist Styles -->
  <link rel="stylesheet" href="css/style.css?v=2.2">
</head>

<body>

  <!-- Top Navigation Bar -->
  <header class="top-header">
    <div class="app-container d-flex flex-wrap align-items-center justify-content-between gap-3">

      <!-- Clean Brand (No extra labels) -->
      <a href="/" class="text-decoration-none d-flex align-items-center gap-2">
        <span class="fs-4">🎓</span>
        <span class="brand-title">Mail-E</span>
      </a>

      <!-- Channel Statuses & Action Buttons -->
      <div class="d-flex align-items-center gap-2 flex-wrap">

        <!-- Gmail Status -->
        <div class="channel-pill" id="pill-gmail">
          <span class="status-indicator" id="dot-gmail"></span>
          <i class="bi bi-google text-secondary"></i>
          <span id="text-gmail">Gmail: Checking...</span>
          <a href="/api/gmail/connect" class="btn btn-sm btn-outline-light py-0 px-2 d-none" id="btn-oauth-action"
            style="font-size: 0.72rem;">Authorise</a>
        </div>

        <!-- Telegram Status -->
        <div class="channel-pill" id="pill-telegram">
          <span class="status-indicator" id="dot-telegram"></span>
          <i class="bi bi-telegram text-info"></i>
          <span id="text-telegram">Telegram: Checking...</span>
          <button class="btn btn-sm btn-outline-secondary py-0 px-2 text-light" data-bs-toggle="modal"
            data-bs-target="#modal-channels" style="font-size: 0.72rem;">Edit</button>
        </div>

        <!-- SMS Gateway Status -->
        <div class="channel-pill" id="pill-sms">
          <span class="status-indicator" id="dot-sms"></span>
          <i class="bi bi-phone text-success"></i>
          <span id="text-sms">SMS: Checking...</span>
          <button class="btn btn-sm btn-outline-secondary py-0 px-2 text-light" data-bs-toggle="modal"
            data-bs-target="#modal-channels" style="font-size: 0.72rem;">Edit</button>
        </div>

        <!-- Monitor Status Pill with Configuration Dropdown -->
        <div class="dropdown">
          <button class="channel-pill btn-dropdown-custom d-flex align-items-center gap-2 border-0" id="pill-monitor"
            data-bs-toggle="dropdown" aria-expanded="false" title="Click to adjust background polling interval"
            style="cursor: pointer;">
            <span class="status-indicator online" id="dot-monitor"></span>
            <i class="bi bi-clock-history text-secondary"></i>
            <span id="text-monitor">Monitor: 3m</span>
            <i class="bi bi-chevron-down text-muted" style="font-size: 0.65rem;"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-dark shadow border-secondary border-opacity-50"
            aria-labelledby="pill-monitor" style="background: var(--bg-surface); font-size: 0.82rem;">
            <li>
              <h6 class="dropdown-header text-white">Auto-Poll Frequency</h6>
            </li>
            <li><button class="dropdown-item btn-set-interval" data-interval="1">Every 1 minute (Fast)</button></li>
            <li><button class="dropdown-item btn-set-interval active" data-interval="3">Every 3 minutes
                (Default)</button></li>
            <li><button class="dropdown-item btn-set-interval" data-interval="5">Every 5 minutes</button></li>
            <li><button class="dropdown-item btn-set-interval" data-interval="10">Every 10 minutes</button></li>
            <li><button class="dropdown-item btn-set-interval" data-interval="15">Every 15 minutes</button></li>
            <li><button class="dropdown-item btn-set-interval" data-interval="30">Every 30 minutes</button></li>
            <li>
              <hr class="dropdown-divider border-secondary border-opacity-50">
            </li>
            <li><button class="dropdown-item text-warning" id="btn-toggle-monitor">Pause Polling</button></li>
          </ul>
        </div>

        <!-- Action: Check Inbox Now -->
        <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1 ms-1" id="btn-check-inbox">
          <i class="bi bi-arrow-repeat"></i>
          <span>Check Inbox</span>
        </button>

        <!-- Action: Simulate Email -->
        <button class="btn btn-sm btn-primary d-flex align-items-center gap-1" data-bs-toggle="modal"
          data-bs-target="#modal-simulate">
          <i class="bi bi-plus-lg"></i>
          <span>Simulate Email</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="app-container py-3">

    <!-- Metric Strip (Interactive Filters) -->
    <section class="stats-strip">
      <div class="stat-item active" data-filter="all" title="Click to show all inbound emails" role="button" tabindex="0">
        <div class="stat-label">Total Inbound Emails</div>
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-hint"><i class="bi bi-filter"></i> Show All</div>
      </div>
      <div class="stat-item" data-filter="placement" title="Click to show only Placements" role="button" tabindex="0">
        <div class="stat-label">Placements Detected (Alerted)</div>
        <div class="stat-val text-success" id="stat-placements">0</div>
        <div class="stat-hint"><i class="bi bi-filter"></i> Filter Placements</div>
      </div>
      <div class="stat-item" data-filter="interview" title="Click to show only Interview Shortlists" role="button" tabindex="0">
        <div class="stat-label">Interview Shortlists</div>
        <div class="stat-val text-info" id="stat-interviews">0</div>
        <div class="stat-hint"><i class="bi bi-filter"></i> Filter Interviews</div>
      </div>
      <div class="stat-item" data-filter="filtered" title="Click to show Discarded Marketing Noise" role="button" tabindex="0">
        <div class="stat-label">Marketing Noise Discarded</div>
        <div class="stat-val text-warning" id="stat-noise">0</div>
        <div class="stat-hint"><i class="bi bi-filter"></i> Filter Noise</div>
      </div>
    </section>

    <!-- Full-Width Inbound Emails & Decision Feed -->
    <section class="inbox-panel">

      <!-- Toolbar: Tabs, Search, and Clear -->
      <div class="inbox-toolbar">

        <div class="tab-pills-group">
